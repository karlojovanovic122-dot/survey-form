<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Umfrageformular</title>
    <style>
        body { font-family: sans-serif; background: #1b1b32; color: #f5f6f7; padding: 20px; text-align: center; }
        main { max-width: 500px; margin: 0 auto; background: rgba(39, 39, 74, 0.9); padding: 30px; border-radius: 8px; text-align: left; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="number"], select, textarea { width: 100%; padding: 10px; border: 1px solid #0a0a23; background: #0a0a23; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { display: block; width: 100%; padding: 12px; background: #3b3b4f; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <main>
        <h1 id="title">Karlo's Entwickler-Umfrage</h1>
        <p id="description">Sag uns, wie du am liebsten programmierst!</p>
        <form id="survey-form">
            <div class="form-group">
                <label id="name-label" for="name">Name:</label>
                <input id="name" type="text" placeholder="Dein Name" required>
            </div>
            <div class="form-group">
                <label id="email-label" for="email">E-Mail:</label>
                <input id="email" type="email" placeholder="Deine E-Mail" required>
            </div>
            <div class="form-group">
                <label id="number-label" for="number">Alter:</label>
                <input id="number" type="number" min="10" max="99" placeholder="Alter">
            </div>
            <div class="form-group">
                <label for="dropdown">Lieblingssprache:</label>
                <select id="dropdown">
                    <option value="html">HTML</option>
                    <option value="js">JavaScript</option>
                </select>
            </div>
            <div class="form-group">
                <label><input type="radio" name="device" value="pc" checked> PC</label>
                <label><input type="radio" name="device" value="smartphone"> Handy</label>
            </div>
            <div class="form-group">
                <label><input type="checkbox" value="frontend"> Frontend</label>
            </div>
            <div class="form-group">
                <label for="comments">Anmerkungen:</label>
                <textarea id="comments" placeholder="Text..."></textarea>
            </div>
            <button id="submit" type="submit">Absenden</button>
        </form>
    </main>
</body>
</html>
